<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Criar conta - Café Ferreira</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>
        :root {
            --marrom-escuro: #3e2723;
            --marrom: #6f4e37;
            --caramelo: #c18b5a;
            --creme: #fce2b4;
            --branco: #ffffff;
        }

        body {
            background-color: var(--creme);
            color: var(--marrom-escuro);
            font-family: Arial, sans-serif;
        }

        .cadastro-container {
            max-width: 750px;
            width: 100%;
        }

        .cadastro-card {
            background-color: var(--branco);
            border: none;
            border-radius: 18px;
        }

        .titulo {
            color: var(--marrom-escuro);
            font-weight: bold;
        }

        .subtitulo {
            color: #795548;
        }

        .secao-titulo {
            color: var(--marrom);
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 2px solid var(--creme);
            padding-bottom: 8px;
            margin: 24px 0 18px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            padding: 10px 12px;
            border-color: #d7c4ae;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--caramelo);
            box-shadow: 0 0 0 0.2rem rgba(193, 139, 90, 0.2);
        }

        .btn-cadastrar {
            background-color: var(--marrom);
            color: var(--branco);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
        }

        .btn-cadastrar:hover {
            background-color: var(--marrom-escuro);
            color: var(--branco);
        }

        .link-login {
            color: var(--marrom);
            font-weight: bold;
            text-decoration: none;
        }

        .link-login:hover {
            text-decoration: underline;
        }

        .obrigatorio {
            color: #b02a37;
        }
    </style>
</head>

<body>

<main class="container min-vh-100 d-flex
             justify-content-center align-items-center py-4">

    <section class="cadastro-container">

        <div class="card cadastro-card shadow p-4 p-md-5">

            <header class="text-center mb-4">
                <h1 class="h2 titulo">Café Ferreira</h1>

                <p class="subtitulo mb-0">
                    Crie sua conta para fazer pedidos.
                </p>

                <small class="text-muted">
                    Preencha seus dados para continuar.
                </small>
            </header>

            <!-- Mensagem de erro -->
            <div th:if="${erro}"
                 class="alert alert-danger"
                 role="alert"
                 th:text="${erro}">
            </div>

            <form th:action="@{/criar-conta}" method="post">

                <!-- Proteção CSRF do Spring Security -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- DADOS PESSOAIS -->
                <h2 class="secao-titulo mt-0">Dados pessoais</h2>

                <div class="row g-3">

                    <div class="col-12">
                        <label for="nome" class="form-label">
                            Nome completo <span class="obrigatorio">*</span>
                        </label>

                        <input type="text"
                               id="nome"
                               name="nome"
                               class="form-control"
                               th:value="${nome}"
                               minlength="2"
                               maxlength="100"
                               autocomplete="name"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">
                            E-mail <span class="obrigatorio">*</span>
                        </label>

                        <input type="email"
                               id="email"
                               name="email"
                               class="form-control"
                               th:value="${email}"
                               maxlength="150"
                               autocomplete="email"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="telefone" class="form-label">
                            Telefone <span class="obrigatorio">*</span>
                        </label>

                        <input type="tel"
                               id="telefone"
                               name="telefone"
                               class="form-control"
                               th:value="${telefone}"
                               placeholder="(11) 99999-9999"
                               maxlength="20"
                               autocomplete="tel"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="senha" class="form-label">
                            Senha <span class="obrigatorio">*</span>
                        </label>

                        <input type="password"
                               id="senha"
                               name="senha"
                               class="form-control"
                               minlength="8"
                               maxlength="72"
                               autocomplete="new-password"
                               required>

                        <div class="form-text">
                            Utilize pelo menos 8 caracteres.
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="confirmarSenha" class="form-label">
                            Confirmar senha
                            <span class="obrigatorio">*</span>
                        </label>

                        <input type="password"
                               id="confirmarSenha"
                               name="confirmarSenha"
                               class="form-control"
                               minlength="8"
                               maxlength="72"
                               autocomplete="new-password"
                               required>
                    </div>

                </div>

                <!-- ENDEREÇO -->
                <h2 class="secao-titulo">Endereço</h2>

                <div class="row g-3">

                    <div class="col-md-8">
                        <label for="rua" class="form-label">
                            Rua / Avenida
                            <span class="obrigatorio">*</span>
                        </label>

                        <input type="text"
                               id="rua"
                               name="rua"
                               class="form-control"
                               th:value="${rua}"
                               maxlength="150"
                               autocomplete="address-line1"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label for="numero" class="form-label">
                            Número <span class="obrigatorio">*</span>
                        </label>

                        <input type="text"
                               id="numero"
                               name="numero"
                               class="form-control"
                               th:value="${numero}"
                               maxlength="10"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="complemento" class="form-label">
                            Complemento
                        </label>

                        <input type="text"
                               id="complemento"
                               name="complemento"
                               class="form-control"
                               th:value="${complemento}"
                               maxlength="100"
                               placeholder="Apto., bloco, casa...">
                    </div>

                    <div class="col-md-6">
                        <label for="bairro" class="form-label">
                            Bairro <span class="obrigatorio">*</span>
                        </label>

                        <input type="text"
                               id="bairro"
                               name="bairro"
                               class="form-control"
                               th:value="${bairro}"
                               maxlength="100"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="cidade" class="form-label">
                            Cidade <span class="obrigatorio">*</span>
                        </label>

                        <input type="text"
                               id="cidade"
                               name="cidade"
                               class="form-control"
                               th:value="${cidade}"
                               maxlength="100"
                               autocomplete="address-level2"
                               required>
                    </div>

                    <div class="col-md-3">
                        <label for="estado" class="form-label">
                            Estado (UF) <span class="obrigatorio">*</span>
                        </label>

                        <input type="text"
                               id="estado"
                               name="estado"
                               class="form-control text-uppercase"
                               th:value="${estado}"
                               minlength="2"
                               maxlength="2"
                               placeholder="SP"
                               autocomplete="address-level1"
                               required>
                    </div>

                    <div class="col-md-3">
                        <label for="cep" class="form-label">
                            CEP <span class="obrigatorio">*</span>
                        </label>

                        <input type="text"
                               id="cep"
                               name="cep"
                               class="form-control"
                               th:value="${cep}"
                               maxlength="9"
                               placeholder="00000-000"
                               autocomplete="postal-code"
                               required>
                    </div>

                </div>

                <p class="text-muted small mt-3 mb-4">
                    <span class="obrigatorio">*</span>
                    Campos obrigatórios.
                </p>

                <button type="submit"
                        class="btn btn-cadastrar w-100">
                    Criar minha conta
                </button>

            </form>

            <p class="text-center mt-4 mb-0">
                Já tem uma conta?
                <a th:href="@{/login}" class="link-login">
                    Fazer login
                </a>
            </p>

        </div>

        <footer class="text-center mt-3 small">
            &copy; 2026 Café Ferreira. Todos os direitos reservados.
        </footer>

    </section>

</main>

<script>
    // Confere se as duas senhas são iguais antes de enviar.
    const formulario = document.querySelector("form");
    const senha = document.getElementById("senha");
    const confirmarSenha = document.getElementById("confirmarSenha");

    formulario.addEventListener("submit", function (evento) {
        if (senha.value !== confirmarSenha.value) {
            evento.preventDefault();
            confirmarSenha.setCustomValidity("As senhas não coincidem.");
            confirmarSenha.reportValidity();
        } else {
            confirmarSenha.setCustomValidity("");
        }
    });

    confirmarSenha.addEventListener("input", function () {
        confirmarSenha.setCustomValidity("");
    });
</script>

</body>
</html>
