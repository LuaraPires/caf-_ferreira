
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login - Café Ferreira</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body style="background-color: #fce2b4; color: #3e2723;">

<main class="container min-vh-100 d-flex
             justify-content-center align-items-center">

    <section class="card shadow p-4"
             style="width: 100%; max-width: 420px;">

        <div class="text-center mb-4">
            <h1 class="h3">Café Ferreira</h1>
            <p>Entre na sua conta</p>
        </div>

        <div th:if="${param.erro}"
             class="alert alert-danger">
            E-mail ou senha inválidos, ou conta inativa.
        </div>

        <div th:if="${param.logout}"
             class="alert alert-success">
            Você saiu da sua conta.
        </div>

        <form th:action="@{/login}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="mb-3">
                <label for="email" class="form-label">
                    E-mail
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       autocomplete="username"
                       required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">
                    Senha
                </label>

                <input type="password"
                       id="senha"
                       name="senha"
                       class="form-control"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit"
                    class="btn w-100 text-white"
                    style="background-color: #6f4e37;">
                Entrar
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Ainda não tem conta?
            <a th:href="@{/criar-conta}"
               style="color: #6f4e37;">
                Criar conta
            </a>
        </p>

    </section>
</main>

</body>
</html>
