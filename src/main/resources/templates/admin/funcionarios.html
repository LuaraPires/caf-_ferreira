
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Funcionários - Café Ferreira</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body style="background-color: #fce2b4; color: #3e2723;">

<nav class="navbar navbar-dark px-4"
     style="background-color: #3e2723;">
    <a class="navbar-brand" th:href="@{/admin/funcionarios}">
        Café Ferreira | Administração
    </a>

    <form th:action="@{/logout}" method="post" class="m-0">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit" class="btn btn-outline-light btn-sm">
            Sair
        </button>
    </form>
</nav>

<main class="container py-5">

    <h1 class="h3 mb-4">Gerenciar funcionários</h1>

    <div th:if="${sucesso}"
         class="alert alert-success"
         role="alert"
         th:text="${sucesso}">
    </div>

    <div th:if="${erro}"
         class="alert alert-danger"
         role="alert"
         th:text="${erro}">
    </div>

    <section class="card shadow-sm mb-5">
        <div class="card-body p-4">

            <h2 class="h5 mb-3">Cadastrar funcionário</h2>

            <form th:action="@{/admin/funcionarios/cadastrar}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="nome" class="form-label">
                        Nome completo
                    </label>

                    <input type="text"
                           id="nome"
                           name="nome"
                           class="form-control"
                           maxlength="100"
                           required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        E-mail
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           maxlength="150"
                           required>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">
                        Senha inicial
                    </label>

                    <input type="password"
                           id="senha"
                           name="senha"
                           class="form-control"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                </div>

                <div class="mb-3">
                    <label for="confirmarSenha" class="form-label">
                        Confirmar senha
                    </label>

                    <input type="password"
                           id="confirmarSenha"
                           name="confirmarSenha"
                           class="form-control"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                </div>

                <p class="text-muted small">
                    O perfil será definido automaticamente como
                    FUNCIONARIO.
                </p>

                <button type="submit"
                        class="btn text-white"
                        style="background-color: #6f4e37;">
                    Cadastrar funcionário
                </button>
            </form>
        </div>
    </section>

    <section class="card shadow-sm">
        <div class="card-body p-4">

            <h2 class="h5 mb-3">Funcionários cadastrados</h2>

            <div class="table-responsive">
                <table class="table table-striped align-middle">

                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Situação</th>
                        <th>Ação</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="funcionario : ${funcionarios}">
                        <td th:text="${funcionario.nome}"></td>
                        <td th:text="${funcionario.email}"></td>

                        <td>
                            <span th:if="${funcionario.ativo}"
                                  class="badge bg-success">
                                Ativo
                            </span>

                            <span th:unless="${funcionario.ativo}"
                                  class="badge bg-secondary">
                                Inativo
                            </span>
                        </td>

                        <td>
                            <form th:if="${funcionario.ativo}"
                                  th:action="@{/admin/funcionarios/{id}/inativar(id=${funcionario.id})}"
                                  method="post">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <button type="submit"
                                        class="btn btn-outline-danger btn-sm">
                                    Inativar
                                </button>
                            </form>

                            <form th:unless="${funcionario.ativo}"
                                  th:action="@{/admin/funcionarios/{id}/reativar(id=${funcionario.id})}"
                                  method="post">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <button type="submit"
                                        class="btn btn-outline-success btn-sm">
                                    Reativar
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(funcionarios)}">
                        <td colspan="4" class="text-center">
                            Nenhum funcionário cadastrado.
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>
        </div>
    </section>

</main>

</body>
</html>
